<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Site C - popup with a non-focusable close button</title>
  <style>
    body { margin: 0; font: 24px sans-serif; background: #222; color: #eee; }
    #overlay { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.6); }
    #modal { position: absolute; left: 30%; top: 25%; width: 40%; padding: 32px; background: #445; }
    #close { position: absolute; right: 16px; top: 8px; font-size: 40px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Site C (popup test)</h1>
  <p>Popup closed: <span id="closed">no</span> | Arrow keys seen by site: <span id="arrows">0</span></p>
  <div id="overlay">
    <div id="modal">
      <span id="close">&times;</span>
      <h2>Update</h2>
      <p>This popup's close button is a plain span with a JS click handler.</p>
    </div>
  </div>
  <script>
    // Like many sites: click handler attached in JS, no href/role/tabindex/onclick attribute.
    document.getElementById('close').addEventListener('click', function () {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('closed').textContent = 'yes';
    });
    // The site also eats arrow keys, so fallback spatial navigation stays off.
    var arrows = 0;
    document.addEventListener('keydown', function (e) {
      if (e.keyCode >= 37 && e.keyCode <= 40) {
        arrows++;
        document.getElementById('arrows').textContent = arrows;
        e.preventDefault();
      }
    });
  </script>
  <script src="http://localhost:8080/tvurl.js"></script>
</body>
</html>
